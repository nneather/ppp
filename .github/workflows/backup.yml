name: Weekly database backup

on:
  schedule:
    # 08:00 UTC Mondays (~2–3am Chicago)
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Only for the failure notice below; this job never checks out the repo.
    permissions:
      issues: write
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump module tables
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [[ "$BACKUP_DATABASE_URL" == *"db."*".supabase.co"* ]]; then
            echo "::error::BACKUP_DATABASE_URL uses Direct (db.*.supabase.co, IPv6-only). Use Session Pooler: Connect → Session pooler, port 5432, user postgres.<ref>"
            exit 1
          fi
          if [[ "$BACKUP_DATABASE_URL" == *":6543/"* ]] || [[ "$BACKUP_DATABASE_URL" == *":6543?"* ]]; then
            echo "::error::BACKUP_DATABASE_URL uses Transaction pooler (port 6543). pg_dump needs Session pooler on port 5432."
            exit 1
          fi

          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version

          MONTH=$(date +%Y-%m)
          YEAR=$(date +%Y)

          INVOICING_TABLES=(
            profiles clients client_rates time_entries invoices invoice_line_items
          )
          LIBRARY_TABLES=(
            books people series publishers bible_books ancient_texts
            book_authors book_bible_coverage book_ancient_coverage book_topics
            essays essay_authors scripture_references
          )
          PROJECTS_TABLES=(
            projects project_updates project_tasks project_links
          )
          CONTACTS_TABLES=(
            households contacts contact_touches contact_lists contact_list_members
            contact_period_skips household_children household_grade_changes
          )

          invoicing_flags=()
          for t in "${INVOICING_TABLES[@]}"; do
            invoicing_flags+=(-t "public.${t}")
          done

          library_flags=()
          for t in "${LIBRARY_TABLES[@]}"; do
            library_flags+=(-t "public.${t}")
          done

          projects_flags=()
          for t in "${PROJECTS_TABLES[@]}"; do
            projects_flags+=(-t "public.${t}")
          done

          contacts_flags=()
          for t in "${CONTACTS_TABLES[@]}"; do
            contacts_flags+=(-t "public.${t}")
          done

          "$PG_DUMP" -F c -f "ppp-invoicing-${MONTH}.dump" "$BACKUP_DATABASE_URL" "${invoicing_flags[@]}"
          "$PG_DUMP" -F c -f "ppp-library-${MONTH}.dump" "$BACKUP_DATABASE_URL" "${library_flags[@]}"
          "$PG_DUMP" -F c -f "ppp-projects-${MONTH}.dump" "$BACKUP_DATABASE_URL" "${projects_flags[@]}"
          "$PG_DUMP" -F c -f "ppp-contacts-${MONTH}.dump" "$BACKUP_DATABASE_URL" "${contacts_flags[@]}"

          echo "MONTH=${MONTH}" >> "$GITHUB_ENV"
          echo "YEAR=${YEAR}" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "ppp-invoicing-${MONTH}.dump" "s3://${R2_BUCKET}/${YEAR}/ppp-invoicing-${MONTH}.dump" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "ppp-library-${MONTH}.dump" "s3://${R2_BUCKET}/${YEAR}/ppp-library-${MONTH}.dump" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "ppp-projects-${MONTH}.dump" "s3://${R2_BUCKET}/${YEAR}/ppp-projects-${MONTH}.dump" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "ppp-contacts-${MONTH}.dump" "s3://${R2_BUCKET}/${YEAR}/ppp-contacts-${MONTH}.dump" \
            --endpoint-url "$R2_ENDPOINT"

      # This runs unattended at ~2-3am Monday, so a failure is otherwise silent
      # and the first sign would be a missing dump in R2 weeks later. A GitHub
      # issue needs no new secret (GITHUB_TOKEN) and mails the repo owner. One
      # open issue is reused across consecutive failures so a broken week does
      # not file a new issue every Monday.
      - name: Report backup failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly database backup is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "The scheduled ppp backup failed - no dumps reached R2 for this week."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Check the failing step first: the PostgreSQL client install (apt/PGDG),"
            echo "pg_dump against BACKUP_DATABASE_URL, or the R2 upload."
            echo
            echo "After fixing, re-run this workflow from the Actions tab to take the"
            echo "missed backup - the next scheduled run will not backfill it."
          } > /tmp/backup-failure.md

          # --jq cannot take --arg, so the title comes through the environment.
          # Fails open: if the lookup itself errors, file a fresh issue rather
          # than letting set -e kill the step and send nothing.
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/backup-failure.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/backup-failure.md
          fi
